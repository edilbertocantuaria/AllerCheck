services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: allercheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - db
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # GPU NVIDIA MX450 habilitada
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      # LLM Configuration
      - REWRITE_PROVIDER=${REWRITE_PROVIDER}
      - REWRITE_MODEL=${REWRITE_MODEL}
      - ANSWER_PROVIDER=${ANSWER_PROVIDER}
      - ANSWER_MODEL=${ANSWER_MODEL}
      # Temperaturas (OBRIGATÓRIAS)
      - REWRITE_TEMPERATURE=${REWRITE_TEMPERATURE}
      - ANSWER_TEMPERATURE=${ANSWER_TEMPERATURE}
      - EVALUATOR_TEMPERATURE=${EVALUATOR_TEMPERATURE}
      # SLM/Ollama
      - SLM_PROVIDER=${SLM_PROVIDER}
      - SLM_BASE_URL=${SLM_BASE_URL}
      - SLM_MODEL=${SLM_MODEL}
      # Vector Database
      - INDEX_NAME=${INDEX_NAME}
      # Authentication
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      # Retrieval
      - RETRIEVAL_K=${RETRIEVAL_K}
      - RETRIEVAL_SCORE_THRESHOLD=${RETRIEVAL_SCORE_THRESHOLD}
      - HYDE_K=${HYDE_K}
      - HYDE_SCORE_THRESHOLD=${HYDE_SCORE_THRESHOLD}
      # Chunking
      - CHUNK_SIZE=${CHUNK_SIZE}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP}
      # Ingestion
      - INGEST_INTERVAL_SECONDS=${INGEST_INTERVAL_SECONDS}
      - INGEST_SOURCE_PATH=${INGEST_SOURCE_PATH}
      - INGEST_FORCE_EXTRACT=${INGEST_FORCE_EXTRACT}
      - INGEST_FORCE_RECREATE_INDEX=${INGEST_FORCE_RECREATE_INDEX}
      # RAGAS Models
      - OPENAI_LLM_MODEL=${OPENAI_LLM_MODEL}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      - GEMINI_LLM_MODEL=${GEMINI_LLM_MODEL}
      - CLAUDE_MODEL=${CLAUDE_MODEL}
    volumes:
      - ./api/config.yaml:/app/config.yaml:ro
      - ./api/docs:/app/docs
      - ./api/logs:/app/logs
    depends_on:
      - db
      - ollama
    restart: unless-stopped

  ingest-worker:
    build:
      context: ./api
    command:
      - /bin/sh
      - -lc
      - |
        while true; do
          interval="$${INGEST_INTERVAL_SECONDS:-7200}";
          start_epoch="$(date +%s)";
          echo "[ingest-worker] starting ingestion at $(date '+%Y-%m-%d %H:%M:%S') (interval=$${interval}s)";

          if python ingestion/ingest_documents.py; then
            echo "[ingest-worker] ingestion finished successfully";
          else
            echo "[ingest-worker] ingestion failed (will retry)";
          fi;

          end_epoch="$(date +%s)";
          duration="$((end_epoch - start_epoch))";
          sleep_for="$((interval - duration))";

          if [ "$${sleep_for}" -lt 0 ]; then
            sleep_for=0;
          fi;

          echo "[ingest-worker] duration=$${duration}s, sleeping=$${sleep_for}s, next cycle at $(date -d "+$${sleep_for} seconds" '+%Y-%m-%d %H:%M:%S')";
          sleep "$${sleep_for}";
        done
    environment:
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      # LLM Configuration
      - REWRITE_PROVIDER=${REWRITE_PROVIDER}
      - REWRITE_MODEL=${REWRITE_MODEL}
      - ANSWER_PROVIDER=${ANSWER_PROVIDER}
      - ANSWER_MODEL=${ANSWER_MODEL}
      # Temperaturas (OBRIGATÓRIAS)
      - REWRITE_TEMPERATURE=${REWRITE_TEMPERATURE}
      - ANSWER_TEMPERATURE=${ANSWER_TEMPERATURE}
      - EVALUATOR_TEMPERATURE=${EVALUATOR_TEMPERATURE}
      # SLM/Ollama
      - SLM_PROVIDER=${SLM_PROVIDER}
      - SLM_BASE_URL=${SLM_BASE_URL}
      - SLM_MODEL=${SLM_MODEL}
      # Vector Database
      - INDEX_NAME=${INDEX_NAME}
      # Authentication
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      # Retrieval
      - RETRIEVAL_K=${RETRIEVAL_K}
      - RETRIEVAL_SCORE_THRESHOLD=${RETRIEVAL_SCORE_THRESHOLD}
      - HYDE_K=${HYDE_K}
      - HYDE_SCORE_THRESHOLD=${HYDE_SCORE_THRESHOLD}
      # Chunking
      - CHUNK_SIZE=${CHUNK_SIZE}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP}
      # Ingestion
      - INGEST_INTERVAL_SECONDS=${INGEST_INTERVAL_SECONDS}
      - INGEST_SOURCE_PATH=${INGEST_SOURCE_PATH}
      - INGEST_FORCE_EXTRACT=${INGEST_FORCE_EXTRACT}
      - INGEST_FORCE_RECREATE_INDEX=${INGEST_FORCE_RECREATE_INDEX}
      # RAGAS Models
      - OPENAI_LLM_MODEL=${OPENAI_LLM_MODEL}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      - GEMINI_LLM_MODEL=${GEMINI_LLM_MODEL}
      - CLAUDE_MODEL=${CLAUDE_MODEL}
      # Python logging
      - PYTHONUNBUFFERED=1
    volumes:
      - ./api/config.yaml:/app/config.yaml:ro
      - ./api/docs:/app/docs
      - ./api/logs:/app/logs
    depends_on:
      - db
      - ollama
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - API_BASE_URL=http://api:8000
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  